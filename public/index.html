<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Mafias</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .filtros {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .filtros input, .filtros select, .filtros button {
      padding: 6px 10px;
      border-radius: 5px;
      border: none;
    }
    .lista {
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* Mostrar 5 por fila */
      gap: 10px;
    }
    .tarjeta-mafia {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .tarjeta-mafia:hover {
      background: #272727;
    }
    .estado-activa { border-left: 4px solid #4caf50; }
    .estado-por-vencer { border-left: 4px solid #ffc107; }
    .estado-vencida { border-left: 4px solid #f44336; }
    .estado-disponible { border-left: 4px solid #9e9e9e; }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      padding-top: 100px;
      left: 0; top: 0; width: 100%; height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-contenido {
      background-color: #1e1e1e;
      margin: auto;
      padding: 20px;
      border: 1px solid #888;
      width: 400px;
      border-radius: 10px;
    }
    .cerrar-modal {
      float: right;
      font-size: 22px;
      cursor: pointer;
      color: #f0f0f0;
    }
    form input, form select {
      width: 100%;
      margin-bottom: 10px;
      padding: 5px;
      border-radius: 5px;
      border: none;
    }
    button {
      cursor: pointer;
      background-color: #03a9f4;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 5px;
    }
    button:hover {
      background-color: #0288d1;
    }
    .error {
      color: #f44336;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>📊 Gestión de Mafias</h1>

  <div class="filtros">
    <select id="filtro-estado">
      <option value="todos">Todos</option>
      <option value="activa">Activas</option>
      <option value="por vencer">Por vencer</option>
      <option value="vencida">Vencidas</option>
      <option value="disponible">Disponibles</option>
      <option value="barra">Barras</option>
    </select>
    <input type="text" id="buscador" placeholder="Buscar...">
    <button id="btn-nueva-mafia">➕ Nueva</button>
  </div>

  <div id="lista-mafias" class="lista"></div>

  <!-- Modal -->
  <div id="modal-mafia" class="modal">
    <div class="modal-contenido">
      <span class="cerrar-modal">&times;</span>
      <form id="form-mafia">
        <label>Tipo:</label>
        <select id="tipo">
          <option value="mafia">Mafia</option>
          <option value="barra">Barra</option>
        </select>

        <div id="campos-mafia">
          <label>Número:</label>
          <input type="number" id="numero" readonly>

          <label>Nivel:</label>
          <select id="nivel">
            <option value="Nivel 1">Nivel 1</option>
            <option value="Nivel 2">Nivel 2</option>
            <option value="Nivel 3">Nivel 3</option>
            <option value="Nivel 4">Nivel 4</option>
          </select>
        </div>

        <div id="campos-barra" style="display:none">
          <label>Nombre de la barra:</label>
          <input type="text" id="nombre-barra">
        </div>

        <label>ID Jefe:</label>
        <input type="text" id="id-jefe">

        <label>Sede:</label>
        <input type="text" id="sede">

        <label>Precio:</label>
        <input type="number" id="precio">

        <label>Vehículos:</label>
        <input type="text" id="vehiculos">

        <label>Agregados:</label>
        <input type="text" id="agregados">

        <label>Día de creación:</label>
        <input type="date" id="dia-creacion">

        <label>Vencimiento:</label>
        <input type="date" id="vencimiento">

        <div id="error-fecha" class="error">⚠ La fecha de vencimiento no puede ser anterior a la de creación</div>

        <div style="display:flex; justify-content: space-between; margin-top:10px;">
          <button type="submit">💾 Guardar</button>
          <button type="button" id="btn-renovar">🔁 Renovar</button>
          <button type="button" id="btn-cerrar-mafia">🧹 Cerrar/Vaciar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 📡 Socket.IO cliente -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
  const socket = io();
  let mafias = [];

  socket.on("connect", () => console.log("🟢 Conectado al servidor"));

  // --- Eventos de servidor ---
  socket.on("mafias-actualizadas", (data) => { mafias = data; mostrarMafias(); });
  socket.on("mafia-creada", (m) => { mafias.push(m); mostrarMafias(); });
  socket.on("mafia-editada", (m) => {
    const i = mafias.findIndex(x=>x.id===m.id);
    if(i>=0){ mafias[i]=m; mostrarMafias(); }
  });
  socket.on("mafia-eliminada", (id) => {
    mafias = mafias.filter(m=>m.id!==id);
    mostrarMafias();
  });

  function calcularEstado(m){
    if(!m.diaCreacion||!m.vencimiento) return "Disponible";
    const hoy=new Date(),cre=new Date(m.diaCreacion),ven=new Date(m.vencimiento);
    hoy.setHours(0,0,0,0); cre.setHours(0,0,0,0); ven.setHours(0,0,0,0);
    if(ven<hoy) return "Vencida";
    const diff=(ven-hoy)/(1000*60*60*24);
    if(diff<=5) return "Por vencer";
    if(cre<=hoy&&ven>hoy) return "Activa";
    return "Disponible";
  }

  function mostrarMafias(){
    const lista=document.getElementById("lista-mafias");
    const filtro=document.getElementById("filtro-estado").value;
    const texto=document.getElementById("buscador").value.toLowerCase();
    lista.innerHTML="";
    const datos=mafias.map(m=>({...m, estado: calcularEstado(m)}));
    const filtradas=datos.filter(m=>{
      const coincide = filtro==="todos"||(m.tipo==="mafia"&&m.estado.toLowerCase()===filtro.toLowerCase())||(m.tipo==="barra"&&filtro==="barra");
      const cadena = m.tipo==="mafia"?`#${m.numero} ${m.idJefe} ${m.sede}`.toLowerCase():`${m.nombre} ${m.idJefe} ${m.sede}`.toLowerCase();
      return coincide && cadena.includes(texto);
    });
    if(filtradas.length===0){ lista.innerHTML=`<div class='tarjeta-mafia estado-disponible'>No hay registros</div>`; return; }
    filtradas.forEach(m=>{
      const d=document.createElement("div");
      let clase="estado-disponible";
      if(m.tipo==="mafia"){
        if(m.estado==="Activa") clase="estado-activa";
        else if(m.estado==="Por vencer") clase="estado-por-vencer";
        else if(m.estado==="Vencida") clase="estado-vencida";
      }
      d.className="tarjeta-mafia "+clase;
      d.innerHTML=`
        <h4>${m.tipo==="barra"?m.nombre:"Mafia #"+m.numero}</h4>
        ${m.tipo==="mafia"?`<p><b>Nivel:</b> ${m.nivel}</p>`:""}
        ${m.vencimiento?`<p><b>Vence:</b> ${m.vencimiento}</p>`:""}
      `;
      d.onclick=()=>abrirModal(m.id);
      lista.appendChild(d);
    });
  }

  const modal=document.getElementById("modal-mafia");
  const cerrarModalBtn=document.querySelector(".cerrar-modal");
  const form=document.getElementById("form-mafia");
  const tipoSelect=document.getElementById("tipo");
  const camposMafia=document.getElementById("campos-mafia");
  const camposBarra=document.getElementById("campos-barra");
  const numeroInput=document.getElementById("numero");
  const btnRenovar=document.getElementById("btn-renovar");
  const btnCerrar=document.getElementById("btn-cerrar-mafia");
  let mafiaActual=null;

  function abrirModal(id=null){
    modal.style.display="block";
    mafiaActual=mafias.find(m=>m.id===id)||null;
    tipoSelect.value=mafiaActual?mafiaActual.tipo:"mafia";
    actualizarCampos();
    if(mafiaActual){
      document.getElementById("nivel").value=mafiaActual.nivel;
      numeroInput.value=mafiaActual.numero;
      document.getElementById("nombre-barra").value=mafiaActual.nombre||"";
      document.getElementById("id-jefe").value=mafiaActual.idJefe;
      document.getElementById("sede").value=mafiaActual.sede;
      document.getElementById("precio").value=mafiaActual.precio;
      document.getElementById("vehiculos").value=mafiaActual.vehiculos;
      document.getElementById("agregados").value=mafiaActual.agregados;
      document.getElementById("dia-creacion").value=mafiaActual.diaCreacion;
      document.getElementById("vencimiento").value=mafiaActual.vencimiento;
    }else{
      form.reset();
      numeroInput.value = mafias.filter(m=>m.tipo==="mafia").length + 1;
    }
    numeroInput.readOnly = true;
  }

  function actualizarCampos(){
    if(tipoSelect.value==="barra"){
      camposMafia.style.display="none";
      camposBarra.style.display="block";
      btnRenovar.style.display="none";
    } else {
      camposMafia.style.display="block";
      camposBarra.style.display="none";
      btnRenovar.style.display="inline-block";
    }
  }

  tipoSelect.addEventListener("change", actualizarCampos);
  cerrarModalBtn.onclick=()=>modal.style.display="none";
  window.onclick=e=>{ if(e.target===modal) modal.style.display="none"; }

  form.onsubmit=function(e){
    e.preventDefault();
    const tipo=tipoSelect.value;
    const nueva={
      id: mafiaActual?mafiaActual.id:null,
      tipo,
      nivel: tipo==="mafia"?document.getElementById("nivel").value:"",
      numero: tipo==="mafia"?numeroInput.value:"",
      nombre: tipo==="barra"?document.getElementById("nombre-barra").value:"",
      idJefe: document.getElementById("id-jefe").value,
      sede: document.getElementById("sede").value,
      precio: document.getElementById("precio").value,
      vehiculos: document.getElementById("vehiculos").value,
      agregados: document.getElementById("agregados").value,
      diaCreacion: document.getElementById("dia-creacion").value,
      vencimiento: document.getElementById("vencimiento").value
    };
    // Validar fechas
    if(nueva.diaCreacion && nueva.vencimiento){
      if(new Date(nueva.vencimiento)<new Date(nueva.diaCreacion)){
        document.getElementById("error-fecha").style.display="block";
        return;
      } else document.getElementById("error-fecha").style.display="none";
    }
    if(mafiaActual){
      socket.emit("editar-mafia", nueva);
    } else {
      socket.emit("crear-mafia", nueva);
    }
    modal.style.display="none";
  }

  btnRenovar.onclick=()=>{
    if(!mafiaActual) return;
    const hoy=new Date();
    const ven=new Date(mafiaActual.vencimiento||hoy);
    ven.setDate(ven.getDate()+30); // +30 días
    document.getElementById("vencimiento").value=ven.toISOString().slice(0,10);
  }

  btnCerrar.onclick=()=>{
    if(!mafiaActual) return;
    socket.emit("cerrar-mafia", mafiaActual.id);
    modal.style.display="none";
  }

  document.getElementById("btn-nueva-mafia").onclick=()=>abrirModal();

  document.getElementById("filtro-estado").onchange=mostrarMafias;
  document.getElementById("buscador").oninput=mostrarMafias;

  mostrarMafias();

  // --- 📄 Botón de descarga de logs ---
  const btnLogs = document.createElement("button");
  btnLogs.textContent = "📄 Logs";
  btnLogs.style.position = "fixed";
  btnLogs.style.top = "20px";
  btnLogs.style.right = "20px";
  btnLogs.style.zIndex = "1200";
  btnLogs.style.padding = "10px";
  btnLogs.style.background = "#03a9f4";
  btnLogs.style.border = "none";
  btnLogs.style.color = "#fff";
  btnLogs.style.cursor = "pointer";
  document.body.appendChild(btnLogs);

  btnLogs.onclick = async () => {
    try {
      const res = await fetch("/download-logs");
      if (!res.ok) throw new Error("No se pudo obtener el archivo de logs");
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "logs.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    } catch (err) {
      alert("⚠ Error al descargar los logs");
      console.error(err);
    }
  };
  </script>
</body>
</html>
